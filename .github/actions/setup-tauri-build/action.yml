name: 'Setup Tauri Build Environment'
description: 'Install Task, Rust, and platform deps. Use mode=check to skip Node.js, frontend deps, and cargo tools.'

inputs:
  node-version:
    description: 'Node.js version'
    default: '20'
  mode:
    description: 'Setup mode: "full" installs everything for Tauri builds; "check" installs only Rust + Task for cargo check/clippy'
    default: 'full'

runs:
  using: 'composite'
  steps:
    - name: Bootstrap Windows prerequisites (git, pwsh)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $toInstall = @()
        if (-not (Get-Command git -ErrorAction SilentlyContinue)) { $toInstall += 'git' }
        if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { $toInstall += 'pwsh' }
        if ($toInstall.Count -gt 0) {
          choco install @toInstall -y
        }
        $gitPath = (Get-ItemProperty 'HKLM:\SOFTWARE\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
        if ($gitPath) {
          echo "$gitPath\cmd" >> $env:GITHUB_PATH
        }

    - name: Read pinned Rust toolchain from .tool-versions (Unix)
      if: runner.os != 'Windows'
      id: rust-version-unix
      shell: bash
      run: |
        version=$(grep '^rust ' .tool-versions | awk '{print $2}')
        echo "toolchain=${version}" >> "$GITHUB_OUTPUT"

    - name: Read pinned Rust toolchain from .tool-versions (Windows)
      if: runner.os == 'Windows'
      id: rust-version-windows
      shell: pwsh
      run: |
        $version = (Select-String -Path .tool-versions -Pattern '^rust ').Line -replace '^rust\s+',''
        echo "toolchain=$version" >> $env:GITHUB_OUTPUT

    - name: Setup macOS self-hosted runner PATH
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
        echo "/opt/homebrew/bin:/opt/homebrew/sbin" >> $GITHUB_PATH

    - name: Setup Windows PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        $gitPath = (Get-ItemProperty 'HKLM:\SOFTWARE\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
        if ($gitPath) { echo "$gitPath\usr\bin" >> $env:GITHUB_PATH }

    - name: Set rustup default host to MSVC (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Get-Command rustup -ErrorAction SilentlyContinue) {
          rustup set default-host x86_64-pc-windows-msvc
        }

    - name: Install Task
      uses: go-task/setup-task@v1

    - name: Setup Node.js
      if: inputs.mode == 'full'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install frontend dependencies (non-Windows)
      if: inputs.mode == 'full' && runner.os != 'Windows'
      shell: bash
      working-directory: ./app/frontend
      run: npm ci

    - name: Install frontend dependencies (Windows)
      if: inputs.mode == 'full' && runner.os == 'Windows'
      shell: pwsh
      working-directory: ./app/frontend
      run: npm ci

    - name: Setup Rust toolchain (${{ steps.rust-version-unix.outputs.toolchain || steps.rust-version-windows.outputs.toolchain }})
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.rust-version-unix.outputs.toolchain || steps.rust-version-windows.outputs.toolchain }}
        components: rustfmt, clippy
        target: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || '' }}
        cache: false

    - name: Setup CI environment (macOS/Linux, full)
      if: inputs.mode == 'full' && runner.os != 'Windows'
      shell: bash
      run: task ci:setup

    - name: Setup CI environment (macOS/Linux, check)
      if: inputs.mode == 'check' && runner.os != 'Windows'
      shell: bash
      run: task ci:setup-check

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        # VC++ runtime must come first — choco NSIS installers (rustup-init.exe, etc.)
        # require it to launch and fail with SxS errors on bare Server 2019 without it.
        $out = Join-Path $env:TEMP 'vc_redist.x64.exe'
        (New-Object Net.WebClient).DownloadFile('https://aka.ms/vs/17/release/vc_redist.x64.exe', $out)
        $proc = Start-Process -FilePath $out -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
        # 0=success  1638=already installed  3010=reboot needed (safe to ignore in CI)
        if ($proc.ExitCode -notin @(0, 1638, 3010)) { exit $proc.ExitCode }

        $toInstall = @()
        if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { $toInstall += 'cmake' }
        if (-not (Get-Command 7z   -ErrorAction SilentlyContinue)) { $toInstall += '7zip' }
        if ($toInstall.Count -gt 0) {
          choco install @toInstall -y
          if ($toInstall -contains 'cmake') {
            echo "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH
          }
        }

        # rustup via direct download — choco spawns a grandchild process whose SxS
        # activation context predates the vc_redist install above, causing a
        # side-by-side configuration error. A direct Start-Process call works.
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          $rustupInit = Join-Path $env:TEMP 'rustup-init.exe'
          (New-Object Net.WebClient).DownloadFile(
            'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe',
            $rustupInit
          )
          $proc = Start-Process -FilePath $rustupInit `
            -ArgumentList '-y','--default-toolchain','none','--no-modify-path' `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
        }

    - name: Install cargo-binstall (Windows)
      if: inputs.mode == 'full' && runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command cargo-binstall -ErrorAction SilentlyContinue)) {
          $zip = Join-Path $env:TEMP "cargo-binstall.zip"
          $bin = Join-Path $env:USERPROFILE ".cargo\bin"
          $url = "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          (New-Object Net.WebClient).DownloadFile($url, $zip)
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          Remove-Item $zip
        }

    - name: Setup CI environment (Windows, full)
      if: inputs.mode == 'full' && runner.os == 'Windows'
      shell: pwsh
      run: task ci:setup PINNED_RUST=${{ steps.rust-version-windows.outputs.toolchain }}

    - name: Setup CI environment (Windows, check)
      if: inputs.mode == 'check' && runner.os == 'Windows'
      shell: pwsh
      run: task ci:setup-check PINNED_RUST=${{ steps.rust-version-windows.outputs.toolchain }}

    - name: Windows Defender exclusions
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      run: |
        Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
        Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
        Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"

    - name: Cargo registry cache (Windows)
      if: runner.os == 'Windows'
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: "true"
        cache-targets: "false"
      env:
        CARGO_INCREMENTAL: "0"
