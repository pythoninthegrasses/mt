name: 'Setup Tauri Build Environment'
description: 'Install Node.js, Rust, and frontend deps for Tauri builds'

inputs:
  node-version:
    description: 'Node.js version'
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Add Homebrew to PATH
      if: runner.os == 'macOS'
      shell: bash
      run: echo "/opt/homebrew/bin:/opt/homebrew/sbin" >> $GITHUB_PATH

    - name: Install macOS system dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew list cmake &>/dev/null && echo "cmake already installed" || brew install cmake

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
          cmake zlib1g-dev libgtk-3-dev

    - name: Install Windows system dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false

    - name: Install frontend dependencies
      shell: bash
      working-directory: ./app/frontend
      run: npm ci
