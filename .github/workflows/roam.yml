name: Roam Code Analysis

on:
  # TODO: enable PRs
  # pull_request:
  #   branches: main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  roam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install roam-code
      - run: roam index
      - run: roam fitness
      - run: roam pr-risk --json
