fail_fast: true

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --quiet
        language: system
        types: [rust]
        pass_filenames: false
  - repo: https://github.com/nozaq/pre-commit-deno
    rev: 0.1.0
    hooks:
      - id: deno-fmt
        files: \.(ts|tsx|js|jsx|json|jsonc)$
      - id: deno-lint
        files: \.(ts|tsx|js|jsx)$
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.jsonc]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored third-party sources are never reformatted. Mirrors the
      # "Vendor libraries" exclude in deno.jsonc and the -text attribute for
      # zig-core/vendor/ in .gitattributes. Anchored here and aliased by the
      # text-mutating hooks below; overrides the hook's own exclude when used.
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: &vendored |
            (?x)^(
                app/frontend/public/js/basecoat/.*|
                zig-core/vendor/.*
            )$
      - id: check-executables-have-shebangs
        files: \.(sh)$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        files: \.(sh)$
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        files: \.(sh|rs|js|ts|css|html)$
        exclude: *vendored
      - id: fix-byte-order-marker
        exclude: *vendored
      - id: mixed-line-ending
        files: \.(sh|rs|js|ts|css|html)$
        exclude: *vendored
      - id: check-toml
        files: \.toml$
      - id: check-yaml
        args: [--unsafe]
        files: \.(yaml|yml)$
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-sort-keys']
        files: \.(json|jsonc)$
        # Editor configs and generated/vendored JSON: Tauri regenerates
        # crates/mt-tauri/gen/, and the rest is tool-written or recorded data
        # we keep as-is.
        exclude: |
            (?x)^(
                .devcontainer/devcontainer.json|
                .vscode/launch.json|
                .vscode/settings.json|
                .vscode/extensions.json|
                app/frontend/package-lock.json|
                crates/mt-tauri/gen/.*|
                .agents/.*\.json|
                benchmarks/.*\.json
            )$
