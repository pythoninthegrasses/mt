<!-- Now Playing View -->
<div x-show="$store.ui.view === 'nowPlaying'" x-cloak class="h-full" x-data="nowPlayingView">
  <div class="flex h-full">
    <!-- Left Panel: Album Art + Track Info -->
    <div class="flex-1 flex items-center justify-center p-8">
      <template x-if="$store.player.currentTrack">
        <div class="flex flex-col items-center gap-6 max-w-md">
          <div class="w-72 h-72 bg-muted rounded-lg flex items-center justify-center shadow-xl shrink-0 overflow-hidden" data-testid="album-art-container">
            <template x-if="$store.player.artwork">
              <img
                :src="'data:' + $store.player.artwork.mime_type + ';base64,' + $store.player.artwork.data"
                alt="Album artwork"
                class="w-full h-full object-cover"
                data-testid="album-art-image"
              >
            </template>
            <template x-if="!$store.player.artwork">
              <svg class="w-24 h-24 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24" data-testid="album-art-placeholder">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
              </svg>
            </template>
          </div>
          <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold" x-text="$store.player.currentTrack.title || 'Unknown'"></h2>
            <p class="text-lg text-muted-foreground" x-text="$store.player.currentTrack.artist || 'Unknown Artist'"></p>
            <p class="text-base text-muted-foreground/70" x-text="$store.player.currentTrack.album || ''"></p>
          </div>
        </div>
      </template>
      <template x-if="!$store.player.currentTrack">
        <div class="text-center text-muted-foreground">
          <svg class="w-24 h-24 mx-auto mb-6 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
          </svg>
          <p class="text-xl">No track playing</p>
          <p class="text-sm mt-2">Select a track from the library or queue</p>
        </div>
      </template>
    </div>

    <!-- Right Panel: Up Next Queue -->
    <div class="w-96 border-l border-border flex flex-col bg-card/50">
      <div class="p-4 border-b border-border">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-muted-foreground">Up Next</h3>
      </div>
      <div class="flex-1 overflow-y-auto" x-ref="queueList">
        <div x-show="$store.queue.items.length === 0" class="p-8 text-center text-muted-foreground">
          <p class="text-sm">Queue is empty</p>
          <p class="text-xs mt-1">Add tracks from the library</p>
        </div>
        <div x-show="$store.queue.items.length > 0" :style="`height: ${queueTotalHeight}px; position: relative;`">
          <div :style="`transform: translateY(${queueOffsetY}px); will-change: transform;`" x-ref="sortableContainer">
          <template x-for="item in visibleQueueItems" :key="item.track.id + '-' + item.originalIndex">
            <div
              class="queue-item-wrapper"
              :class="[
                getShiftDirection(item.originalIndex) === 'up' ? 'shift-up' : '',
                getShiftDirection(item.originalIndex) === 'down' ? 'shift-down' : ''
              ]"
            >
              <div
                class="queue-item flex items-center gap-3 px-3 py-2 border-b border-[#E5E5E5] dark:border-[#323232] select-none cursor-default"
                :class="[
                  item.isCurrentTrack ? 'bg-primary/20 text-primary' : '',
                  isDragging(item.originalIndex) ? 'dragging-item' : '',
                  isOtherDragging(item.originalIndex) ? 'other-dragging' : 'hover:bg-muted/50'
                ]"
                :style="isDragging(item.originalIndex) ? 'transform:' + getDragTransform() + '; z-index: 50;' : ''"
                :data-id="item.track.id"
                @dblclick.stop="$store.queue.playIndex(item.originalIndex)"
              >
                <div
                  class="drag-handle cursor-grab active:cursor-grabbing text-muted-foreground/50 hover:text-muted-foreground"
                  @mousedown.prevent="startDrag(item.originalIndex, $event)"
                  @touchstart.prevent="startDrag(item.originalIndex, $event)"
                  @dblclick.stop
                >
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                  </svg>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium truncate" x-text="item.track.title || 'Unknown'"></p>
                  <p class="text-xs truncate" :class="item.isCurrentTrack ? 'text-primary/70' : 'text-muted-foreground'" x-text="item.track.artist || 'Unknown Artist'"></p>
                </div>
                <template x-if="item.isCurrentTrack">
                  <div class="shrink-0">
                    <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                  </div>
                </template>
                <button
                  class="shrink-0 p-1 rounded hover:bg-destructive/20 text-muted-foreground hover:text-destructive transition-colors"
                  @click.stop="$store.queue.remove(item.originalIndex)"
                  title="Remove from queue"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </div>
          </template>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
