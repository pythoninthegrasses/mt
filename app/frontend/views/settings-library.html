<!-- Library Section -->
<div x-show="isSection('library')" data-testid="settings-section-library">
  <h3 class="text-xl font-semibold mb-4">Library</h3>

  <!-- Watched Folders -->
  <div class="mb-8">
    <h4 class="text-sm font-medium text-muted-foreground uppercase tracking-wider mb-3">Watched Folders</h4>
    <div class="space-y-4">
      <div>
        <p class="text-xs text-muted-foreground mb-3">Automatically scan these folders for new music</p>
      </div>

      <!-- Browser fallback -->
      <template x-if="!window.__TAURI__">
        <div class="px-4 py-3 rounded-md bg-muted/50 text-sm text-muted-foreground">
          Watched folders are only available in the desktop app.
        </div>
      </template>

      <!-- Watched folders list -->
      <template x-if="window.__TAURI__">
        <div>
          <!-- Loading state -->
          <template x-if="watchedFoldersLoading">
            <div class="text-sm text-muted-foreground py-4 text-center">Loading...</div>
          </template>

          <!-- Empty state -->
          <template x-if="!watchedFoldersLoading && watchedFolders.length === 0">
            <div class="px-4 py-6 rounded-md border border-dashed border-border text-center">
              <p class="text-sm text-muted-foreground mb-2">No watched folders configured</p>
              <button
                @click="addWatchedFolder()"
                class="text-sm text-primary hover:underline"
                data-testid="watched-folder-add-empty-btn"
              >
                Add your first folder
              </button>
            </div>
          </template>

          <!-- Folders list -->
          <template x-if="!watchedFoldersLoading && watchedFolders.length > 0">
            <div class="space-y-2" data-testid="watched-folders-list">
              <template x-for="folder in watchedFolders" :key="folder.id">
                <div
                  class="flex items-center gap-3 px-3 py-2 rounded-md border border-border bg-background"
                  :data-testid="'watched-folder-item-' + folder.id"
                >
                  <!-- Folder path -->
                  <div class="flex-1 min-w-0">
                    <span
                      class="text-sm font-mono truncate block"
                      :title="folder.path"
                      x-text="truncatePath(folder.path)"
                    ></span>
                  </div>

                  <!-- Mode select -->
                  <select
                    class="text-xs px-2 py-1 rounded border border-border bg-background focus:ring-1 focus:ring-primary"
                    :value="folder.mode"
                    @change="updateWatchedFolder(folder.id, { mode: $event.target.value })"
                  >
                    <option value="startup">On startup</option>
                    <option value="continuous">Continuous</option>
                  </select>

                  <!-- Cadence (only for continuous) -->
                  <template x-if="folder.mode === 'continuous'">
                    <div class="flex items-center gap-1">
                      <input
                        type="number"
                        min="1"
                        max="1440"
                        class="w-14 text-xs px-2 py-1 rounded border border-border bg-background text-center focus:ring-1 focus:ring-primary"
                        :value="folder.cadence_minutes || 10"
                        @change="updateWatchedFolder(folder.id, { cadence_minutes: parseInt($event.target.value) || 10 })"
                      />
                      <span class="text-xs text-muted-foreground">min</span>
                    </div>
                  </template>

                  <!-- Rescan button -->
                  <button
                    @click="rescanWatchedFolder(folder.id)"
                    :disabled="isFolderScanning(folder.id)"
                    class="p-1.5 rounded hover:bg-muted/70 transition-colors disabled:opacity-50"
                    title="Rescan now"
                    :data-testid="'watched-folder-rescan-btn-' + folder.id"
                  >
                    <svg
                      class="w-4 h-4"
                      :class="rescanIconClass(folder.id)"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                  </button>

                  <!-- Remove button -->
                  <button
                    @click="removeWatchedFolder(folder.id)"
                    class="p-1.5 rounded hover:bg-destructive/10 hover:text-destructive transition-colors"
                    title="Remove folder"
                    :data-testid="'watched-folder-remove-btn-' + folder.id"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>
              </template>
            </div>
          </template>

          <!-- Add folder button -->
          <button
            @click="addWatchedFolder()"
            class="mt-3 px-4 py-2 rounded-md border text-sm transition-colors border-border hover:bg-muted/50"
            data-testid="watched-folder-add-btn"
          >
            Add Folder
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- Scanning -->
  <div class="mb-8">
    <h4 class="text-sm font-medium text-muted-foreground uppercase tracking-wider mb-3">Scanning</h4>
    <div class="space-y-4">
      <div class="bg-muted/30 rounded-lg p-4">
        <div class="flex items-center justify-between mb-3">
          <div>
            <div class="font-medium text-sm">Manual Scan</div>
            <div class="text-xs text-muted-foreground mt-0.5">
              Update file fingerprints and merge duplicate entries
            </div>
          </div>
          <button
            class="px-4 py-2 text-sm bg-primary text-primary-foreground rounded-md hover:bg-primary/90 transition-colors disabled:opacity-50"
            :disabled="reconcileScan.isRunning"
            @click="runReconcileScan()"
            data-testid="settings-reconcile-scan"
          >
            <span x-text="scanButtonText()"></span>
          </button>
        </div>

        <!-- Progress bar -->
        <template x-if="reconcileScan.progress && reconcileScan.progress.phase !== 'complete'">
          <div class="mt-3" data-testid="reconcile-progress">
            <div class="flex justify-between text-xs text-muted-foreground mb-1">
              <span x-text="reconcilePhaseText()"></span>
              <span x-show="reconcileScan.progress.total > 0" x-text="reconcileProgressText()"></span>
            </div>
            <div class="w-full bg-muted rounded-full h-2 overflow-hidden">
              <div
                class="bg-primary h-2 rounded-full transition-all duration-300"
                :style="reconcileProgressWidth()"
              ></div>
            </div>
          </div>
        </template>

        <!-- Results -->
        <template x-if="reconcileScan.lastResult !== null">
          <div class="mt-3 pt-3 border-t border-border/50">
            <div class="text-xs text-muted-foreground mb-2">Last scan results:</div>
            <div class="grid grid-cols-3 gap-4 text-sm">
              <div class="text-center">
                <div class="font-medium" x-text="reconcileScan.lastResult.backfilled"></div>
                <div class="text-xs text-muted-foreground">Backfilled</div>
              </div>
              <div class="text-center">
                <div class="font-medium" x-text="reconcileScan.lastResult.duplicates_merged + (reconcileScan.lastResult.cross_directory_suppressed || 0)"></div>
                <div class="text-xs text-muted-foreground">Duplicates Merged</div>
              </div>
              <div class="text-center" x-show="reconcileScan.lastResult.reinstated > 0">
                <div class="font-medium" x-text="reconcileScan.lastResult.reinstated"></div>
                <div class="text-xs text-muted-foreground">Reinstated</div>
              </div>
              <div class="text-center">
                <div class="font-medium" x-text="reconcileScan.lastResult.errors"></div>
                <div class="text-xs text-muted-foreground">Errors</div>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Cross-directory dedup toggle -->
      <label class="flex items-center gap-3 cursor-pointer">
        <input
          type="checkbox"
          class="rounded"
          x-model="deduplicateAcrossDirectories"
          @change="toggleDeduplicateAcrossDirectories()"
          data-testid="settings-dedup-across-dirs"
        />
        <div class="flex-1">
          <div class="text-sm font-medium">Deduplicate tracks across directories</div>
          <div class="text-xs text-muted-foreground">
            When the same track exists in multiple watched directories, show only one copy.
            Prefers the oldest source file.
          </div>
        </div>
      </label>

      <p class="text-xs text-muted-foreground">
        Updates file fingerprints (inode and content hash) to enable move detection,
        and merges any duplicate entries found in your library.
      </p>
    </div>
  </div>
</div>
