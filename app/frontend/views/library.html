<!-- Library View -->
<div
  x-show="$store.ui.view === 'library'"
  x-cloak
  x-data="libraryBrowser"
  @keydown.window="$store.ui.view === 'library' && handleKeydown($event)"
  class="h-full flex flex-col min-h-0 select-none"
>
  <!-- Track table - single scroll container for both vertical and horizontal -->
  <div class="flex-1 min-h-0 w-full overflow-auto" x-ref="scrollContainer">
    <!-- Table header (CSS Grid) - sticky at top of scroll container -->
    <div
      data-testid="library-header"
      class="grid border-b border-border text-sm font-medium text-muted-foreground relative sticky top-0 z-10 bg-background"
      :class="{ 'resizing-columns': resizingColumn }"
      :style="`grid-template-columns: ${getGridTemplateColumns()}`"
      @contextmenu.prevent="handleHeaderContextMenu($event)"
    >
      <template x-for="(col, colIndex) in columns" :key="col.key">
        <div
          :class="getColumnHeaderClasses(col, colIndex)"
          class="py-2 select-none flex items-center relative overflow-visible"
          :title="col.label || ''"
          :style="getColumnHeaderStyle(col)"
          @mousedown="handleColumnHeaderMousedown(col, $event)"
          @click="handleColumnHeaderClick(col)"
        >
          <span x-text="col.label" class="truncate"></span>
          <span
            x-show="col.sortable && library.sortBy === col.key"
            x-text="getSortIndicator(col.key)"
            class="sort-indicator ml-1 shrink-0"
          ></span>
          <!-- Left resizer (resizes previous column) - not on first column -->
          <div
            x-show="colIndex > 0"
            class="column-resizer-left"
            :data-testid="`col-resizer-left-${col.key}`"
            @mousedown.stop.prevent="startColumnResize(columns[colIndex - 1], $event)"
            @dblclick.stop.prevent="autoFitColumn(columns[colIndex - 1], $event)"
            @click.stop.prevent
          >
          </div>
          <!-- Right resizer (resizes current column) -->
          <div
            class="column-resizer-right"
            :class="{ 'last-column-resizer': colIndex === columns.length - 1 }"
            :data-testid="`col-resizer-right-${col.key}`"
            @mousedown.stop.prevent="startColumnResize(col, $event)"
            @dblclick.stop.prevent="autoFitColumn(col, $event)"
            @click.stop.prevent
          >
          </div>
        </div>
      </template>
    </div>

    <!-- Header context menu for column visibility -->
    <div
      x-show="headerContextMenu"
      x-cloak
      class="header-context-menu fixed z-100 min-w-45 border border-border rounded-lg shadow-lg p-1 bg-card"
      :style="headerContextMenu ? `left: ${headerContextMenu.x}px; top: ${headerContextMenu.y}px` : ''"
      @click.away="headerContextMenu = null"
    >
      <template x-if="headerContextMenu">
        <div>
          <div class="px-2 py-1 text-xs text-muted-foreground font-medium">Show Columns</div>
          <template x-for="item in headerContextMenu.items" :key="item.key">
            <div
              class="context-menu-item"
              :class="{ 'opacity-50 cursor-not-allowed': !item.canToggle && item.visible }"
              @click="item.canToggle && toggleColumnVisibility(item.key)"
            >
              <span class="w-4 text-center" x-text="item.visible ? '✓' : ''"></span>
              <span x-text="item.label"></span>
            </div>
          </template>
          <div class="context-menu-separator"></div>
          <div class="context-menu-item" @click="confirmResetColumnDefaults()">
            <span class="w-4"></span>
            <span>Reset Columns to Defaults</span>
          </div>
          <div class="context-menu-item" @click="showAllColumns()">
            <span class="w-4"></span>
            <span>Show All Columns</span>
          </div>
        </div>
      </template>
    </div>

    <!-- Track list - no scroll, parent handles both -->
    <div class="track-list min-h-full w-full relative">
      <!-- Loading state (shown during library fetch OR active scan with empty library) -->
      <template x-if="(library.loading || library.scanning) && library.tracks.length === 0">
        <div
          class="flex items-center justify-center py-12"
        >
          <div class="text-center">
            <svg
              class="animate-spin w-8 h-8 mx-auto mb-2 text-primary"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              >
              </circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              >
              </path>
            </svg>
            <p
              class="text-muted-foreground"
              x-text="library.scanning ? 'Scanning library...' : 'Loading library...'"
            >
            </p>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <div
        x-show="!library.loading && !library.scanning && library.filteredTracks.length === 0"
        class="absolute inset-0 flex items-center justify-center"
      >
        <!-- Liked Songs empty state -->
        <template x-if="library.currentSection === 'liked' && !library.searchQuery">
          <div class="text-center">
            <svg
              class="w-24 h-24 mx-auto mb-6 text-muted-foreground/50"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
              >
              </path>
            </svg>
            <p class="text-lg font-medium">Liked Songs is empty</p>
            <p class="text-sm text-muted-foreground mt-1">Favorite a track to get started</p>
          </div>
        </template>
        <!-- Search empty state -->
        <template x-if="library.searchQuery">
          <div class="text-center">
            <svg
              class="w-24 h-24 mx-auto mb-6 text-muted-foreground/50"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              >
              </path>
            </svg>
            <p class="text-lg font-medium">No tracks found</p>
            <p class="text-sm text-muted-foreground mt-1">Try a different search term</p>
          </div>
        </template>
        <!-- Library empty state -->
        <template x-if="library.currentSection !== 'liked' && !library.searchQuery">
          <div class="text-center">
            <svg
              class="w-24 h-24 mx-auto mb-6 text-muted-foreground/50"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
              >
              </path>
            </svg>
            <p class="text-lg font-medium">Library is empty</p>
            <p class="text-sm text-muted-foreground mt-1">
              Add music to your library to get started
            </p>
          </div>
        </template>
      </div>

      <!-- Track rows (CSS Grid matching header) - Virtual scroll -->
      <div
        x-show="library.filteredTracks.length > 0"
        :style="`height: ${totalContentHeight}px; position: relative;`"
      >
        <div :style="`transform: translateY(${offsetY}px); will-change: transform;`">
          <template x-for="item in visibleTracks" :key="item.track.id">
            <div
              class="grid border-b border-border/30 text-sm cursor-default select-none"
              :style="getTrackRowStyle(item)"
              :class="getTrackRowClasses(item)"
              :data-track-id="item.track.id"
              draggable="true"
              @dragstart="handleTrackDragStart($event, item.track)"
              @dragend="handleTrackDragEnd($event)"
              @click="handleRowClick($event, item.track, item.globalIndex)"
              @dblclick="handleDoubleClick(item.track, item.globalIndex)"
              @contextmenu="handleContextMenu($event, item.track, item.globalIndex)"
            >
              <template x-for="col in columns" :key="col.key">
                <div
                  :class="getTrackCellClasses(col, item)"
                  :data-column="col.key"
                >
                  <template x-if="col.key === 'status'">
                    <span class="flex items-center justify-center w-full h-full">
                      <!-- In playlist view: show drag handle -->
                      <span
                        x-show="isInPlaylistView() && !item.track.missing && !isPlaying(item.track.id)"
                        class="drag-handle cursor-grab active:cursor-grabbing text-muted-foreground/50 hover:text-foreground/70"
                        @mousedown.prevent.stop="startPlaylistDrag(item.globalIndex, $event)"
                        @touchstart.prevent.stop="startPlaylistDrag(item.globalIndex, $event)"
                        @dblclick.stop
                      >⠿</span>
                      <!-- Now playing indicator (shows pause when playing, play when paused) -->
                      <template x-if="isPlaying(item.track.id) && !item.track.missing">
                        <span class="text-primary" data-testid="now-playing-indicator">
                          <template x-if="$store.player.isPlaying">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"></path>
                            </svg>
                          </template>
                          <template x-if="!$store.player.isPlaying">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                              <path d="M8 5v14l11-7z"></path>
                            </svg>
                          </template>
                        </span>
                      </template>
                      <!-- Missing track indicator (takes priority) -->
                      <button
                        x-show="item.track.missing"
                        @click.stop="$store.ui.openMissingTrackPopover(item.track, $event)"
                        class="text-warning hover:text-warning/80 cursor-pointer p-0.5 rounded hover:bg-muted/50"
                        data-testid="missing-track-icon"
                        title="File not found - click for details"
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          class="w-4 h-4"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <circle cx="12" cy="12" r="10" />
                          <line x1="12" y1="16" x2="12" y2="12" />
                          <line x1="12" y1="8" x2="12.01" y2="8" />
                        </svg>
                      </button>
                    </span>
                  </template>
                  <template x-if="col.key === 'index'">
                    <span x-text="getIndexDisplay(item)"></span>
                  </template>
                  <template x-if="col.key === 'title'">
                    <span
                      class="truncate"
                      :class="item.track.missing ? 'text-muted-foreground/70 italic' : ''"
                      x-text="item.track.title || item.track.filename || 'Unknown'"
                    ></span>
                  </template>
                  <template x-if="col.key === 'artist'">
                    <span x-text="item.track.artist || 'Unknown Artist'"></span>
                  </template>
                  <template x-if="col.key === 'album'">
                    <span x-text="item.track.album || ''"></span>
                  </template>
                  <template x-if="col.key === 'lastPlayed'">
                    <span x-text="formatRelativeTime(item.track.last_played)"></span>
                  </template>
                  <template x-if="col.key === 'dateAdded'">
                    <span x-text="formatRelativeTime(item.track.added_date)"></span>
                  </template>
                  <template x-if="col.key === 'playCount'">
                    <span x-text="item.track.play_count || 0"></span>
                  </template>
                  <template x-if="col.key === 'duration'">
                    <span x-text="formatDuration(item.track.duration)"></span>
                  </template>
                  <template x-if="col.key === 'year'">
                    <span x-text="item.track.date || ''"></span>
                  </template>
                  <template x-if="col.key === 'genre'">
                    <span x-text="item.track.genre || ''"></span>
                  </template>
                  <template x-if="col.key === 'trackTotal'">
                    <span x-text="item.track.track_total || ''"></span>
                  </template>
                  <template x-if="col.key === 'discNumber'">
                    <span x-text="item.track.disc_number || ''"></span>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- Context menu -->
  <div
    x-show="contextMenu"
    x-trap="contextMenu"
    x-cloak
    class="context-menu track-context-menu bg-card"
    data-testid="track-context-menu"
    :style="contextMenu ? `left: ${contextMenu.x}px; top: ${contextMenu.y}px` : ''"
    @click.outside="contextMenu = null; showPlaylistSubmenu = false"
  >
    <template x-if="contextMenu">
      <div>
        <template x-for="(item, idx) in contextMenu.items" :key="idx">
          <div>
            <template x-if="item.type === 'separator'">
              <div class="context-menu-separator"></div>
            </template>
            <template x-if="item.type !== 'separator'">
              <div
                class="context-menu-item relative"
                :class="{ 'disabled': item.disabled, 'danger': item.danger }"
                @click="handleContextMenuItemClick(item)"
                @mouseenter="handleSubmenuMouseenter(item, $el)"
                @mouseleave="handleSubmenuMouseleave(item)"
              >
                <span x-text="item.icon" class="w-4 text-center"></span>
                <span x-text="item.label" class="flex-1"></span>
                <span
                  x-show="item.hasSubmenu"
                  class="text-muted-foreground"
                  x-text="submenuOnLeft ? '◀' : '▶'"
                ></span>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Add to Playlist submenu -->
  <div
    x-show="contextMenu && showPlaylistSubmenu"
    x-cloak
    class="context-menu bg-card"
    data-testid="playlist-submenu"
    :style="getSubmenuStyle()"
    @mouseenter="if (submenuCloseTimeout) { clearTimeout(submenuCloseTimeout); submenuCloseTimeout = null; }"
    @mouseleave="showPlaylistSubmenu = false"
  >
    <div
      class="context-menu-item"
      @click="createPlaylistWithTracks()"
    >
      <span class="w-4 text-center">+</span>
      <span>New Playlist...</span>
    </div>
    <div class="context-menu-separator" x-show="playlists.length > 0"></div>
    <template x-for="playlist in playlists" :key="playlist.id">
      <div
        class="context-menu-item"
        @click="addToPlaylist(playlist.id)"
      >
        <span class="w-4 text-center"></span>
        <span x-text="playlist.name" class="truncate"></span>
      </div>
    </template>
    <div x-show="playlists.length === 0" class="px-3 py-2 text-sm text-muted-foreground">
      No playlists yet
    </div>
  </div>
</div>
