version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']
env:
  CARGO_HOME: "{{.ROOT_DIR}}/.cache/cargo"
  CARGO_TARGET_DIR: "{{.ROOT_DIR}}/target"
  RUSTUP_TOOLCHAIN: nightly
  RUSTFLAGS: "-Zthreads=16"
  APPLE_API_KEY_PATH: /tmp/auth_key.p8

vars:
  APP_NAME: '{{.APP_NAME | default "mt"}}'
  APP_VERSION: '{{.APP_VERSION | default "1.0.0"}}'
  BUNDLE_ID: '{{.BUNDLE_ID | default "com.mt.desktop"}}'
  TAURI_DIR: "{{.ROOT_DIR}}/crates/mt-tauri"
  MACOS_ARM64_TARGET: "aarch64-apple-darwin"
  MACOS_X64_TARGET: "x86_64-apple-darwin"
  LINUX_AMD64_TARGET: "x86_64-unknown-linux-gnu"
  LINUX_ARM64_TARGET: "aarch64-unknown-linux-gnu"

tasks:
  info:
    desc: "Show Tauri build configuration"
    cmds:
      - |
        cat << EOF
        Tauri Build Configuration:
          App Name: {{.APP_NAME}}
          Version: {{.APP_VERSION}}
          Bundle ID: {{.BUNDLE_ID}}
          Tauri Directory: {{.TAURI_DIR}}

        Available targets:
          - build            Build for current platform/architecture
          - build:arm64      Build for Apple Silicon (arm64) [macOS]
          - build:x64        Build for Intel (x86_64) [macOS]
          - dev              Run development mode
          - icons            Generate app icons from logo

        Output locations:
          macOS app: target/*/release/bundle/macos/{{.APP_NAME}}.app
          macOS DMG: target/*/release/bundle/dmg/{{.APP_NAME}}_*.dmg
          Linux deb: target/*/release/bundle/deb/{{.APP_NAME}}_*.deb
        EOF
    silent: true

  _install-linux-deps:
    internal: true
    desc: "Install Linux system dependencies for Tauri"
    platforms: [linux]
    env:
      WEBKIT_VERSION: "4.1"
      SOUP_VERSION: "3.0"
    vars:
      # pkg-config name : apt package name
      LINUX_DEPS: >-
        javascriptcoregtk-$WEBKIT_VERSION:libjavascriptcoregtk-$WEBKIT_VERSION-dev
        webkit2gtk-$WEBKIT_VERSION:libwebkit2gtk-$WEBKIT_VERSION-dev
        libsoup-$SOUP_VERSION:libsoup-$SOUP_VERSION-dev
        alsa:libasound2-dev
        dbus-1:libdbus-1-dev
    cmds:
      - |
        if command -v apt-get &> /dev/null; then
          pkgs=""
          for entry in {{.LINUX_DEPS}}; do
            pc="${entry%%:*}"
            apt="${entry##*:}"
            if ! pkg-config --exists "$pc" 2>/dev/null; then
              pkgs="$pkgs $apt"
            fi
          done
          if [ -n "$pkgs" ]; then
            echo "Installing missing Tauri system deps:$pkgs"
            sudo apt-get install -y $pkgs
          fi
        else
          echo "Non-apt system detected — ensure the following dev packages are installed:"
          for entry in {{.LINUX_DEPS}}; do
            echo "  - ${entry%%:*}"
          done
        fi
    preconditions:
      - sh: command -v pkg-config &> /dev/null
        msg: "pkg-config is required. Install it with: sudo apt-get install pkg-config"
    status:
      - pkg-config --exists javascriptcoregtk-$WEBKIT_VERSION
      - pkg-config --exists webkit2gtk-$WEBKIT_VERSION
      - pkg-config --exists libsoup-$SOUP_VERSION
      - pkg-config --exists alsa
      - pkg-config --exists dbus-1

  _build:
    internal: true
    desc: "Internal task to build Tauri app"
    vars:
      TARGET: '{{.TARGET | default ""}}'
      TARGET_FLAG: '{{if .TARGET}}--target {{.TARGET}}{{end}}'
    cmds:
      - |
        deno run -A npm:@tauri-apps/cli build {{.TARGET_FLAG}}

  build:
    desc: "Build Tauri app for current platform"
    deps: [":deno:install", "_install-linux-deps"]
    vars:
      CURRENT_TARGET:
        sh: |
          case "{{OS}}/{{ARCH}}" in
            darwin/arm64)  echo "aarch64-apple-darwin" ;;
            darwin/amd64)  echo "x86_64-apple-darwin" ;;
            linux/amd64)   echo "x86_64-unknown-linux-gnu" ;;
            linux/arm64)   echo "aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported platform: {{OS}}/{{ARCH}}" >&2; exit 1 ;;
          esac
    cmds:
      - task: _build
        vars:
          TARGET: "{{.CURRENT_TARGET}}"
    sources:
      - "{{.TAURI_DIR}}/src/**/*.rs"
      - "{{.TAURI_DIR}}/Cargo.toml"
      - "{{.TAURI_DIR}}/tauri.conf.json"

  build:arm64:
    desc: "Build Tauri app for Apple Silicon (arm64)"
    platforms: [darwin/arm64]
    deps: [":deno:install"]
    cmds:
      - task: _build
        vars:
          TARGET: "{{.MACOS_ARM64_TARGET}}"
    sources:
      - "{{.TAURI_DIR}}/src/**/*.rs"
      - "{{.TAURI_DIR}}/Cargo.toml"
      - "{{.TAURI_DIR}}/tauri.conf.json"

  build:x64:
    desc: "Build Tauri app for Intel (x86_64)"
    platforms: [darwin/amd64]
    deps: [":deno:install"]
    cmds:
      - task: _build
        vars:
          TARGET: "{{.MACOS_X64_TARGET}}"
    sources:
      - "{{.TAURI_DIR}}/src/**/*.rs"
      - "{{.TAURI_DIR}}/Cargo.toml"
      - "{{.TAURI_DIR}}/tauri.conf.json"

  _decode-api-key:
    internal: true
    desc: "Decode base64 ASC API key to /tmp/auth_key.p8"
    cmds:
      - echo '{{.APPLE_API_KEY_B64}}' | base64 --decode > /tmp/auth_key.p8
    silent: true

  build:signed:
    desc: "Build signed macOS app (requires APPLE_SIGNING_IDENTITY)"
    platforms: [darwin]
    deps: [":deno:install"]
    preconditions:
      - sh: '[ -n "$APPLE_SIGNING_IDENTITY" ]'
        msg: "APPLE_SIGNING_IDENTITY env var is required"
    cmds:
      - task: _decode-api-key
      - task: _build
        vars:
          TARGET: "{{.MACOS_ARM64_TARGET}}"

  build:dmg:
    desc: "Build signed DMG installer (requires APPLE_SIGNING_IDENTITY)"
    platforms: [darwin]
    deps: [":deno:install"]
    preconditions:
      - sh: '[ -n "$APPLE_SIGNING_IDENTITY" ]'
        msg: "APPLE_SIGNING_IDENTITY env var is required"
    cmds:
      - task: _decode-api-key
      - deno run -A npm:@tauri-apps/cli build --target {{.MACOS_ARM64_TARGET}} --bundles dmg

  dev:
    desc: "Run Tauri in development mode"
    deps: [":deno:install"]
    cmds:
      - deno run -A npm:@tauri-apps/cli dev
    interactive: true
    ignore_error: true

  dev:mcp:
    desc: "Run Tauri in development mode with MCP bridge for AI agent debugging"
    deps: [":deno:install"]
    cmds:
      - deno run -A npm:@tauri-apps/cli dev -- --features mcp
    interactive: true
    ignore_error: true

  icons:
    desc: "Generate app icons from logo"
    cmds:
      - deno run -A npm:@tauri-apps/cli icon {{.ROOT_DIR}}/static/logo.png
    sources:
      - "{{.ROOT_DIR}}/static/logo.png"
    generates:
      - "{{.TAURI_DIR}}/icons/**/*"

  clean:
    desc: "Clean Tauri build artifacts"
    cmds:
      - rm -rf {{.TAURI_DIR}}/target
      - rm -rf {{.ROOT_DIR}}/build
      - rm -rf {{.ROOT_DIR}}/dist
    silent: true

  clean:rust:
    desc: "Clean only Rust build artifacts"
    cmds:
      - cargo clean
    silent: true

  test-app:
    desc: "Launch the built macOS app"
    platforms: [darwin]
    vars:
      APP_PATH: "{{.ROOT_DIR}}/target/{{.MACOS_ARM64_TARGET}}/release/bundle/macos/{{.APP_NAME}}.app"
    cmds:
      - open "{{.APP_PATH}}"
    preconditions:
      - test -d "{{.APP_PATH}}"

  check-deps:
    desc: "Check if Tauri dependencies are installed"
    cmds:
      - |
        echo "Checking Tauri dependencies..."
        missing=0

        if ! command -v cargo &> /dev/null; then
          echo "cargo not found. Install Rust from https://rustup.rs"
          missing=1
        else
          echo "cargo version: $(cargo --version)"
        fi

        if ! command -v npx &> /dev/null; then
          echo "npx not found. Install Node.js from https://nodejs.org"
          missing=1
        else
          echo "npx available"
        fi

        if [[ $missing -eq 0 ]]; then
          echo "All dependencies satisfied"
        else
          exit 1
        fi
    silent: true

  doctor:
    desc: "Run Tauri doctor to check environment"
    cmds:
      - deno run -A npm:@tauri-apps/cli info

  build:linux-arm64:
    desc: "Build Linux ARM64 .deb via Docker (for Raspberry Pi)"
    cmds:
      - |
        echo "Building mt for aarch64-unknown-linux-gnu via Docker..."
        mkdir -p dist/linux-arm64

        docker build \
          --platform linux/arm64 \
          -f docker/Dockerfile.linux-arm64 \
          --target artifacts \
          --output type=local,dest=dist/linux-arm64 \
          .

        echo ""
        echo "Build complete. Artifacts:"
        ls -lh dist/linux-arm64/
    sources:
      - "{{.TAURI_DIR}}/src/**/*.rs"
      - "{{.TAURI_DIR}}/Cargo.toml"
      - "crates/mt-core/src/**/*.rs"
      - "crates/mt-core/Cargo.toml"
      - "zig-core/src/**/*.zig"
      - "zig-core/build.zig"
      - "app/frontend/js/**/*.js"
      - "app/frontend/index.html"
      - "docker/Dockerfile.linux-arm64"
    generates:
      - "dist/linux-arm64/*.deb"

  build:linux-arm64:shell:
    desc: "Open a shell in the Linux ARM64 build container (debugging)"
    deps: ["build:linux-arm64:image"]
    cmds:
      - |
        docker run --rm -it \
          --platform linux/arm64 \
          mt-builder:linux-arm64 \
          /bin/bash
    interactive: true

  build:linux-arm64:image:
    internal: true
    desc: "Build the Docker builder image"
    cmds:
      - |
        docker build \
          --platform linux/arm64 \
          -f docker/Dockerfile.linux-arm64 \
          --target builder \
          -t mt-builder:linux-arm64 \
          .
    status:
      - docker image inspect mt-builder:linux-arm64 >/dev/null 2>&1
