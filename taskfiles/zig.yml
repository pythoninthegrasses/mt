version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

vars:
  ZIG_CORE_DIR: "{{.ROOT_DIR}}/zig-core"
  ZIG_OUT_DIR: "{{.ZIG_CORE_DIR}}/zig-out"
  ZIG_CACHE_DIR: "{{.ZIG_CORE_DIR}}/.zig-cache"
  PINNED_ZIG:
    sh: grep '^zig ' {{.ROOT_DIR}}/.tool-versions 2>/dev/null | awk '{print $2}' || true
  # Prefers mise resolved against the pinned version (avoids an IDE-bundled zig
  # or a mise default for a different version), falling back to PATH for
  # environments where zig is installed directly, e.g. CI via mlugg/setup-zig.
  ZIG:
    sh: |
      pin="{{.PINNED_ZIG}}"
      if [ -n "$pin" ] && command -v mise &> /dev/null; then
        resolved=$(mise which zig --tool "zig@$pin" 2>/dev/null || true)
        if [ -n "$resolved" ]; then
          echo "$resolved"
          exit 0
        fi
      fi
      command -v zig 2>/dev/null || true
  # Explicit Zig target triple for the cross-compile task, e.g. ZIG_TARGET=aarch64-macos.
  # Named distinctly from ci.yml/tauri.yml's TARGET (a Rust triple) since the two
  # naming schemes disagree (see zig:stage's map).
  ZIG_TARGET: '{{.ZIG_TARGET | default ""}}'
  BINARIES_DIR: "{{.ROOT_DIR}}/crates/mt-tauri/binaries"

tasks:
  _check-zig-version:
    internal: true
    desc: "Verify the pinned zig resolves and matches .tool-versions"
    cmds:
      - |
        zig_bin="{{.ZIG}}"
        if [ -z "$zig_bin" ] || [ ! -x "$zig_bin" ]; then
          echo "error: zig {{.PINNED_ZIG}} not found on mise or PATH." >&2
          echo "  Expected: {{.PINNED_ZIG}} (pinned in .tool-versions)" >&2
          echo "  Fix: install mise (https://mise.jdx.dev), then run: mise install zig" >&2
          exit 1
        fi
        found=$("$zig_bin" version 2>/dev/null)
        if [ "$found" != "{{.PINNED_ZIG}}" ]; then
          echo "error: zig version mismatch." >&2
          echo "  Expected: {{.PINNED_ZIG}} (pinned in .tool-versions)" >&2
          echo "  Found:    ${found:-unknown} ($zig_bin)" >&2
          echo "  Fix: mise install zig@{{.PINNED_ZIG}}" >&2
          exit 1
        fi
        echo "zig $found -> $zig_bin"

  format:
    desc: "Format Zig source files"
    deps: [_check-zig-version]
    cmds:
      - '{{.ZIG}} fmt {{.ZIG_CORE_DIR}}/'

  lint:
    desc: "Check Zig formatting without making changes"
    deps: [_check-zig-version]
    cmds:
      - '{{.ZIG}} fmt --check {{.ZIG_CORE_DIR}}/'

  test:
    desc: "Run Zig unit tests"
    deps: [_check-zig-version]
    cmds:
      - cd {{.ZIG_CORE_DIR}} && {{.ZIG}} build test

  fixture:
    desc: "Generate tests/fixtures/mt_fixture.db from mt_20260127.sql (real schema, real rows)"
    summary: |
      Drives a real Database::new/init through the Rust crate to build a
      fresh SQLite file with the current schema, then loads the `library`
      rows out of the repo-root mt_20260127.sql dump. Zig tests that need a
      real on-disk mt.db (TASK-355.3/355.5 AC#4) open this file and skip if
      it's absent — run this task first to exercise those tests for real.
    cmds:
      - cargo test -p mt-tauri --lib db::fixture_gen::tests::generate_mt_fixture -- --ignored --exact --nocapture
    sources:
      - "{{.ROOT_DIR}}/mt_20260127.sql"
      - "{{.ROOT_DIR}}/crates/mt-tauri/src/db/fixture_gen.rs"
      - "{{.ROOT_DIR}}/crates/mt-tauri/src/db/schema.rs"
    generates:
      - "{{.ROOT_DIR}}/tests/fixtures/mt_fixture.db"

  build:
    desc: "Build zig-core sidecar (debug)"
    deps: [_check-zig-version]
    cmds:
      - cd {{.ZIG_CORE_DIR}} && {{.ZIG}} build
    sources:
      - "{{.ZIG_CORE_DIR}}/src/**/*.zig"
      - "{{.ZIG_CORE_DIR}}/build.zig"
      - "{{.ZIG_CORE_DIR}}/build.zig.zon"
      - "{{.ZIG_CORE_DIR}}/vendor/**"
    generates:
      - "{{.ZIG_OUT_DIR}}/bin/mt-zig-core"

  cross-compile:
    desc: "Cross-compile zig-core for a Zig target triple (ZIG_TARGET required)"
    summary: |
      Cross-compile the zig-core sidecar for an explicit Zig target triple.

        task zig:cross-compile ZIG_TARGET=aarch64-macos
        task zig:cross-compile ZIG_TARGET=x86_64-macos
        task zig:cross-compile ZIG_TARGET=x86_64-linux
        task zig:cross-compile ZIG_TARGET=x86_64-windows
    deps: [_check-zig-version]
    preconditions:
      - sh: test -n "{{.ZIG_TARGET}}"
        msg: |
          ZIG_TARGET is not set. Pass a Zig target triple, e.g.:
            task zig:cross-compile ZIG_TARGET=aarch64-macos
            task zig:cross-compile ZIG_TARGET=x86_64-macos
            task zig:cross-compile ZIG_TARGET=x86_64-linux
            task zig:cross-compile ZIG_TARGET=x86_64-windows
    cmds:
      - cd {{.ZIG_CORE_DIR}} && {{.ZIG}} build -Dtarget={{.ZIG_TARGET}}

  stage:
    desc: "Build zig-core for a Rust host triple and stage it under crates/mt-tauri/binaries (TARGET required)"
    summary: |
      Tauri's externalBin resolves a sidecar by appending the *Rust* host
      triple to the configured binary name, not a Zig target triple, so this
      task is keyed by TARGET=<rust-triple> and maps it to the matching Zig
      target through an explicit table below -- never derived by pattern-
      matching on the Zig triple string (see zig-core/README.md and
      TASK-355.4 for why the two naming schemes disagree, e.g. Zig's
      x86_64-linux is static musl but must be filed under the Rust triple
      x86_64-unknown-linux-gnu).

        task zig:stage TARGET=aarch64-apple-darwin
        task zig:stage TARGET=x86_64-apple-darwin
        task zig:stage TARGET=x86_64-unknown-linux-gnu
        task zig:stage TARGET=x86_64-pc-windows-msvc
    deps: [_check-zig-version]
    vars:
      ZIG_TARGET_FOR_STAGE:
        sh: |
          case "{{.TARGET}}" in
            aarch64-apple-darwin) echo "aarch64-macos" ;;
            x86_64-apple-darwin) echo "x86_64-macos" ;;
            x86_64-unknown-linux-gnu) echo "x86_64-linux" ;;
            x86_64-pc-windows-msvc) echo "x86_64-windows" ;;
            *) echo "" ;;
          esac
      STAGE_OUT_DIR: "{{.ZIG_CORE_DIR}}/zig-out/stage-{{.TARGET}}"
      DEST_EXT: '{{if eq .TARGET "x86_64-pc-windows-msvc"}}.exe{{else}}{{end}}'
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: |
          TARGET is not set. Pass a Rust host triple, e.g.:
            task zig:stage TARGET=aarch64-apple-darwin
            task zig:stage TARGET=x86_64-apple-darwin
            task zig:stage TARGET=x86_64-unknown-linux-gnu
            task zig:stage TARGET=x86_64-pc-windows-msvc
      - sh: test -n "{{.ZIG_TARGET_FOR_STAGE}}"
        msg: "Unmapped Rust triple '{{.TARGET}}' -- add it to zig:stage's hardcoded case table in taskfiles/zig.yml."
    cmds:
      - mkdir -p {{.BINARIES_DIR}}
      - cd {{.ZIG_CORE_DIR}} && {{.ZIG}} build -Dtarget={{.ZIG_TARGET_FOR_STAGE}} -Doptimize=ReleaseSafe -p {{.STAGE_OUT_DIR}}
      # Plain copy, never strip/install -s/objcopy -- stripping would invalidate
      # Zig's ad-hoc code signature on Apple Silicon (AC#8).
      - cp {{.STAGE_OUT_DIR}}/bin/mt-zig-core{{.DEST_EXT}} {{.BINARIES_DIR}}/mt-zig-core-{{.TARGET}}{{.DEST_EXT}}
    sources:
      - "{{.ZIG_CORE_DIR}}/src/**/*.zig"
      - "{{.ZIG_CORE_DIR}}/build.zig"
      - "{{.ZIG_CORE_DIR}}/build.zig.zon"
      - "{{.ZIG_CORE_DIR}}/vendor/**"
    generates:
      - "{{.BINARIES_DIR}}/mt-zig-core-{{.TARGET}}{{.DEST_EXT}}"

  clean:
    desc: "Clean Zig build artifacts"
    cmds:
      - rm -rf {{.ZIG_OUT_DIR}}
      - rm -rf {{.ZIG_CACHE_DIR}}
    silent: true
