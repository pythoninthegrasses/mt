[package]
name = "mt-tauri"
version = "1.6.0"
description = "Desktop music player for large collections"
authors = ["pythoninthegrass"]
edition = "2024"

[[bin]]
name = "mt"
path = "src/main.rs"

[lib]
name = "mt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-devtools = { version = "2", optional = true }
tauri-plugin-mcp-bridge = { version = "0.8", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async HTTP
# TASK-369.3: default-features = false drops `http2`/`h2` — every endpoint we
# call (Last.fm, Plex, lrclib, the Zig sidecar) speaks HTTP/1.1 and ALPN falls
# back gracefully; h2 survives dev builds only via wiremock's hyper/full.
# `default-tls` (native-tls) is required for HTTPS and must stay; `charset`
# gates Response::text() used by shadow_diff and agent/setup; `system-proxy`
# honours OS proxy configuration. Caveat: the `agent` feature re-enables
# reqwest defaults through rig-core's `reqwest-tls`, so h2 returns there.
reqwest = { version = "0.12", default-features = false, features = [
    "default-tls",
    "charset",
    "json",
    "system-proxy",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# Audio playback
rodio = { version = "0.21", features = ["flac", "mp3", "mp4", "vorbis", "wav"] }
parking_lot = "0.12"
thiserror = "2"
chrono = "0.4"

# Media keys (macOS Now Playing widget, MPRIS on Linux, SMTC on Windows)
souvlaki = "0.8"

# Audio metadata reading/writing
lofty = "0.22"

# Database
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"

# Random number generation (for shuffle)
rand = "0.9"

# UUID generation (for scan job IDs)
uuid = { version = "1", features = ["v4", "v5"] }

# Unicode normalization (for Plex track matching)
unicode-normalization = "0.1"

# Filesystem watching with debouncing
notify-debouncer-full = "0.5"

# Scanner (filesystem traversal, parallel processing)
walkdir = "2"
rayon = "1.10"
base64 = "0.22"

# Hashing
sha2 = "0.10.9"
md5 = "0.7"

# LRU cache for artwork
lru = "0.12"

# Image processing for chart grid generation (crates/mt-tauri/src/commands/stats.rs).
# imageproc 0.25 declares `default = ["rayon", "image/default"]`, which used to drag
# image's whole default codec set — including the AV1 encoder rav1e/ravif, exr and webp
# — into every build (TASK-369.2: 33 crates, 238 MiB of artifacts, 27s of compile CPU).
# Keep imageproc default-features off, and keep image's codec list covering every mime
# type scanner::artwork can emit (jpeg, png, gif, bmp, tiff); dropping one silently
# turns that artwork into a text placeholder in the chart grid.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6"

# Agent (optional — requires Ollama running locally)
rig-core = { version = "0.27", features = ["experimental"], optional = true }
schemars = { version = "1", optional = true }

[features]
default = []
devtools = ["dep:tauri-plugin-devtools", "tauri/devtools"]
mcp = ["dep:tauri-plugin-mcp-bridge"]
agent = ["dep:rig-core", "dep:schemars"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Required to extract the HWND from the Tauri window for souvlaki SMTC registration.
# souvlaki panics on Windows if PlatformConfig.hwnd is None.
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSEnumerator"] }
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"
proptest = "1.5"
wiremock = "0.6"
