[package]
name = "mt-core"
version = "1.6.0"
description = "Tauri-independent core logic for the mt music player"
authors = ["pythoninthegrass"]
edition = "2024"

[dependencies]
chrono = "0.4"
lru = "0.12"
parking_lot = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.32"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
