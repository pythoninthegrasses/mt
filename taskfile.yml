version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

dotenv: ['.env']

vars:

includes:
  npm:
    taskfile: ./taskfiles/npm.yml
  deno:
    taskfile: ./taskfiles/deno.yml
  tauri:
    taskfile: ./taskfiles/tauri.yml
  zig:
    taskfile: ./taskfiles/zig.yml

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list

  install-devbox:
    desc: "Install devbox"
    cmds:
      - curl -fsSL https://get.jetify.com/devbox | bash
    run: once
    silent: true
    environment:
      FORCE: 1
      INSTALL_DIR: "{{.HOME}}/.local/bin"
    status:
      - command -v devbox 2>/dev/null

  install:
    desc: "Install project dependencies"
    deps: ["install-devbox"]
    cmds:
      - devbox install

  pre-commit:
    desc: "Run pre-commit hooks"
    cmds:
      - pre-commit run --all-files

  lint:
    desc: "Run linters"
    cmds:
      - task: zig:lint
      - cargo clippy --workspace
      - deno lint

  format:
    desc: "Run formatters"
    cmds:
      - task: zig:fmt
      - cargo fmt --all
      - deno fmt

  test:
    desc: "Run tests (Zig + Rust + Frontend)"
    cmds:
      - task: zig:test
      - |
        if command -v cargo-nextest &> /dev/null; then
          cargo nextest run --workspace
        else
          cargo test --workspace
        fi
      - npm --prefix app/frontend test

  test:e2e:
    desc: "Run Playwright E2E tests"
    cmds:
      - npm --prefix app/frontend run test:e2e

  build:
    desc: "Build Tauri app for current architecture"
    cmds:
      - task: tauri:build

  build:arm64:
    desc: "Build Tauri app for Apple Silicon (arm64)"
    cmds:
      - task: tauri:build:arm64

  build:x64:
    desc: "Build Tauri app for Intel (x86_64)"
    cmds:
      - task: tauri:build:x64

  build:linux-arm64:
    desc: "Build Linux ARM64 .deb via Docker (for Raspberry Pi)"
    cmds:
      - task: tauri:build:linux-arm64

  build:linux-amd64:
    desc: "Build Linux amd64 .deb via Docker"
    cmds:
      - task: tauri:build:linux-amd64

  build:timings:
    desc: "Analyze build performance bottlenecks"
    cmds:
      - cargo build --workspace --timings
      - |
        if [[ "$OSTYPE" == "darwin"* ]]; then
          open target/cargo-timings/cargo-timing.html
        elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
          xdg-open target/cargo-timings/cargo-timing.html 2>/dev/null || echo "Open target/cargo-timings/cargo-timing.html in your browser"
        else
          echo "Open target/cargo-timings/cargo-timing.html in your browser"
        fi

  profile:
    desc: "Show CPU/RAM usage for mt processes (dev + release)"
    platforms: [darwin, linux]
    cmds:
      - |
        case "{{OS}}" in
          darwin)
            procs=$(ps aux | grep -E '[m]t-tauri|/[m]t( |$)' || true)
            ;;
          linux)
            procs=$(ps aux --no-headers | grep -E '[m]t-tauri|/[m]t( |$)|[W]ebKit' || true)
            ;;
        esac
        if [ -z "$procs" ]; then
          echo "No mt processes found."
          exit 0
        fi
        echo "$procs" | awk '
          BEGIN {
            printf "%-8s %-25s %6s %6s %10s\n", "PID", "PROCESS", "CPU%", "MEM%", "RSS (MB)"
            printf "%-8s %-25s %6s %6s %10s\n", "---", "-------", "----", "----", "--------"
          }
          {
            pid=$2; cpu=$3; mem=$4; rss=$6/1024
            cmd=$11; gsub(/.*\//, "", cmd)
            printf "%-8s %-25s %6.1f %6.1f %10.1f\n", pid, cmd, cpu, mem, rss
            tcpu+=cpu; tmem+=mem; trss+=rss
          }
          END {
            printf "%-8s %-25s %6s %6s %10s\n", "---", "-------", "----", "----", "--------"
            printf "%-8s %-25s %6.1f %6.1f %10.1f\n", "", "TOTAL", tcpu, tmem, trss
          }
        '
    silent: true

  repomix:
    desc: "Create llm snapshot of repo"
    preconditions:
      - sh: command -v repomix 2>/dev/null
        msg: "repomix is not installed. Install with: npm install -g repomix"
    cmds:
      - |
        repomix \
          --style markdown \
          --compress \
          --remove-comments \
          --remove-empty-lines \
          --truncate-base64
    sources:
      - "**/*.rs"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.md"
      - "**/*.json"
      - ".repomix*"
    generates:
      - repomix-output.md
